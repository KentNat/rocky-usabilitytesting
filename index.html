<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocky HR Test Runner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  (function () {
    try {
      var saved = localStorage.getItem('rockyUtTheme');
      if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
    } catch (e) {}
  })();
</script>
<style id="page-style">
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#faf9f6;
    --bg-raised:#ffffff;
    --ink:#22252b;
    --ink-soft:#565b66;
    --ink-faint:#8a8f99;
    --border:#e2ded4;
    --border-soft:#ece8de;
    --accent:#1d6f63;
    --accent-ink:#ffffff;
    --accent-soft:#e3efec;
    --warn:#a8631a;
    --warn-soft:#f8ecda;
    --shadow: 0 1px 2px rgba(30,25,10,0.06), 0 8px 24px rgba(30,25,10,0.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15171a; --bg-raised:#1c1f23; --ink:#e9e7e0; --ink-soft:#a7ada9; --ink-faint:#787f7c;
      --border:#31352f; --border-soft:#292d28; --accent:#4fb39f; --accent-ink:#0b1a17;
      --accent-soft:#1b2a26; --warn:#d99a4e; --warn-soft:#2c2416;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15171a; --bg-raised:#1c1f23; --ink:#e9e7e0; --ink-soft:#a7ada9; --ink-faint:#787f7c;
    --border:#31352f; --border-soft:#292d28; --accent:#4fb39f; --accent-ink:#0b1a17;
    --accent-soft:#1b2a26; --warn:#d99a4e; --warn-soft:#2c2416;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15.5px;line-height:1.55;}
  .shell{max-width:800px;margin:0 auto;padding:36px 24px 100px;}

  header.masthead{padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--border);position:relative;}
  .theme-toggle{
    position:absolute;top:0;right:0;display:flex;align-items:center;gap:6px;
    font-size:12px;font-weight:600;padding:6px 12px;border-radius:100px;
    border:1px solid var(--border);background:var(--bg-raised);color:var(--ink-soft);cursor:pointer;
  }
  .theme-toggle:hover{background:var(--border-soft);color:var(--ink);}
  .theme-toggle svg{width:14px;height:14px;flex-shrink:0;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.09em;text-transform:uppercase;color:var(--accent);font-weight:500;}
  h1{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:26px;margin:4px 0 6px;letter-spacing:-0.01em;}
  .subtitle{color:var(--ink-soft);font-size:14.5px;margin:0;}

  .participant-box{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap;}
  .participant-box label{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  .participant-box input{
    flex:1;min-width:180px;font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;
    border:1px solid var(--border);background:var(--bg-raised);color:var(--ink);
  }
  .participant-box input:focus{outline:2px solid var(--accent);outline-offset:1px;}

  h2.sec-title{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:19px;margin:32px 0 14px;}
  .log-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:32px 0 14px;}
  .log-head .sec-title{margin:0;}
  .log-head button{font-size:12px;padding:6px 12px;color:var(--warn);border-color:var(--warn);}
  .log-head button:hover{background:var(--warn-soft);}

  .task-card{border:1px solid var(--border);border-radius:14px;background:var(--bg-raised);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
  .task-head{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;user-select:none;}
  .task-id{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:6px;font-weight:600;flex-shrink:0;}
  .task-title{font-weight:600;font-size:15px;flex:1;}
  .task-status{font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;white-space:nowrap;}
  .task-status.idle{background:var(--border-soft);color:var(--ink-faint);}
  .task-status.running{background:var(--warn-soft);color:var(--warn);}
  .task-status.done{background:var(--accent-soft);color:var(--accent);}
  .chevron{color:var(--ink-faint);font-size:12px;transition:transform .15s;flex-shrink:0;}
  .task-card.open .chevron{transform:rotate(90deg);}

  .task-body{display:none;padding:0 18px 18px;border-top:1px solid var(--border-soft);}
  .task-card.open .task-body{display:block;}

  .instruction{background:var(--bg);border:1px solid var(--border-soft);border-radius:10px;padding:12px 14px;margin:14px 0 10px;font-size:14px;}
  .instruction p{margin:0 0 8px;}
  .instruction ul{margin:0;padding-left:18px;}
  .instruction li{margin-bottom:4px;color:var(--ink-soft);}

  .row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0;}
  button{
    font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--border);
    background:var(--bg-raised);color:var(--ink);cursor:pointer;transition:background .1s;
  }
  button:hover{background:var(--border-soft);}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  button.primary:hover{filter:brightness(1.08);}
  button.stop{background:var(--warn);color:#fff;border-color:var(--warn);}
  button.ghost{background:transparent;}
  button:disabled{opacity:.45;cursor:default;}

  .timer-row{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);}
  .timer-display{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;min-width:76px;}
  .timer-display.running{color:var(--warn);}
  .timer-display.done{color:var(--accent);}

  .cv-box{margin-top:12px;}
  .cv-box .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:600;margin-bottom:6px;}
  .cv-buttons{display:flex;gap:8px;flex-wrap:wrap;}
  .cv-list{max-height:220px;overflow-y:auto;border:1px solid var(--border-soft);border-radius:10px;margin-top:8px;}
  .cv-list table{min-width:0;}
  .cv-list td{padding:6px 12px;font-size:13px;}
  .cv-list button{padding:4px 10px;font-size:12px;}

  .brief{margin-top:14px;border:1px solid var(--border-soft);border-radius:10px;overflow:hidden;}
  .brief-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--accent-soft);}
  .brief-head .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700;}
  .brief-body{padding:12px 14px;font-size:13.5px;}
  .brief-body table{margin-bottom:10px;}
  .brief-body table td{font-size:13px;}
  .brief-body table td:first-child{color:var(--ink-soft);white-space:nowrap;width:1%;padding-right:16px;}
  .brief-sub{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:600;margin:10px 0 4px;}
  .brief-body ul{margin:0 0 4px;padding-left:18px;}
  .brief-body li{margin-bottom:3px;color:var(--ink-soft);}
  .brief-body p{margin:0 0 6px;color:var(--ink-soft);}

  details.reference{margin-top:10px;border:1px solid var(--border-soft);border-radius:10px;}
  details.reference summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--ink-soft);list-style:none;}
  details.reference summary::-webkit-details-marker{display:none;}
  details.reference summary::before{content:'▸ ';color:var(--ink-faint);}
  details.reference[open] summary::before{content:'▾ ';}
  details.reference .reference-body{padding:0 14px 12px;font-size:13px;}
  details.reference table td{font-size:12.5px;}

  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--bg-raised);}
  table{border-collapse:collapse;width:100%;min-width:480px;font-size:13.5px;}
  th{text-align:left;background:var(--border-soft);color:var(--ink-soft);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:9px 12px;border-bottom:1px solid var(--border-soft);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  td.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  .empty-row{color:var(--ink-faint);text-align:center;padding:22px;font-size:13.5px;}

  .note{background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-top:10px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:500;padding:10px 18px;border-radius:100px;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  footer.doc-footer{margin-top:36px;padding-top:20px;border-top:1px solid var(--border);color:var(--ink-faint);font-size:12px;}
</style>
</head>

  function candidateEmail(name) {

  function candidatePhone(i) {

  }
  CANDIDATES.forEach(function (c, i) {
    c.slug = slugify(c.name);

  });

  var root = document.getElementById('root');
  var stateEl = document.getElementById('state-data');
  var LOGS_KEY = 'rockyUtLogs';
  var STATE;
  try {
    var savedLogs = localStorage.getItem(LOGS_KEY);
    STATE = savedLogs ? { logs: JSON.parse(savedLogs) } : JSON.parse(stateEl.textContent || '{"logs":[]}');
  } catch (e) {
    STATE = JSON.parse(stateEl.textContent || '{"logs":[]}');
  }
  if (!STATE.logs) STATE.logs = [];

  var RUNNING_KEY = 'rockyRunningTimers';
  var PARTICIPANT_KEY = 'rockyParticipant';
  var running = {};
  try { running = JSON.parse(sessionStorage.getItem(RUNNING_KEY) || '{}'); } catch (e) { running = {}; }
  var openCard = null;
  var tickInterval = null;

  function persistRunning() {
    try { sessionStorage.setItem(RUNNING_KEY, JSON.stringify(running)); } catch (e) {}
  }
  function getParticipant() {
    try { return localStorage.getItem(PARTICIPANT_KEY) || ''; } catch (e) { return ''; }
  }
  function setParticipantStorage(v) {
    try { localStorage.setItem(PARTICIPANT_KEY, v); } catch (e) {}
  }

  function fmtElapsed(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    var m = Math.floor(s / 60);
    var r = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
  }
  function fmtWhen(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return iso; }
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function taskStatus(task) {
    if (running[task.id]) return 'running';
    var done = STATE.logs.some(function (l) { return l.taskId === task.id && l.participant === getParticipant(); });
    return done ? 'done' : 'idle';
  }

  function fieldRows(rows) {
    return rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; }).join('');
  }

  function renderBrief(task) {
    if (!task.brief) return '';
    var b = task.brief;
    var html = '<div class="brief" data-brief="' + task.id + '">' +
      '<div class="brief-head"><span class="label">' + esc(b.label) + '</span>' +
      '<button type="button" class="ghost" data-action="copy-brief" data-task="' + task.id + '">Salin Brief</button></div>' +
      '<div class="brief-body">' +
      '<table>' + fieldRows(b.fields) + '</table>';
    (b.extraSections || []).forEach(function (sec) {
      html += '<div class="brief-sub">' + esc(sec.heading) + '</div><table>' + fieldRows(sec.rows) + '</table>';
    });
    (b.bulletGroups || []).forEach(function (grp) {
      html += '<div class="brief-sub">' + esc(grp.heading) + '</div><ul>' +
        grp.items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>';
    });
    if (b.note) html += '<p>' + esc(b.note) + '</p>';
    html += '</div></div>';
    return html;
  }

  function renderReference(task) {
    if (!task.reference) return '';
    var r = task.reference;
    return '<details class="reference"><summary>' + esc(r.label) + '</summary>' +
      '<div class="reference-body"><div class="row-actions">' +
      '<button type="button" class="ghost" data-action="copy-reference" data-task="' + task.id + '">Salin Referensi</button>' +

  }

  function renderTaskCard(task) {
    var status = taskStatus(task);
    var isOpen = openCard === task.id;
    var statusLabel = status === 'running' ? 'Berjalan' : status === 'done' ? 'Selesai' : 'Belum dikerjakan';
    var elapsedMs = running[task.id] ? (Date.now() - running[task.id]) : 0;

    var cvHtml = '';
    if (task.needsCV) {
      var cvRows = CANDIDATES.map(function (c) {
        return '<tr><td>' + esc(c.name) + '</td><td style="text-align:right;">' +
          '<button type="button" class="ghost" data-action="download-cv" data-slug="' + c.slug + '">Unduh</button></td></tr>';
      }).join('');
      cvHtml =

        '<div class="label">CV Kandidat (contoh, ' + CANDIDATES.length + ' orang)</div>' +

        '<button type="button" class="primary" data-action="download-all-cv">Unduh Semua (' + CANDIDATES.length + ' CV)</button>' +
        '</div>' +
        '<div class="cv-list"><table>' + cvRows + '</table></div>' +
        '</div>';
    }

    var criteriaHtml = task.criteria.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('');

    var timerBtn = running[task.id]
      ? '<button type="button" class="stop" data-action="stop" data-task="' + task.id + '">Stop</button>'
      : '<button type="button" class="primary" data-action="start" data-task="' + task.id + '">Mulai</button>';

    var timerClass = running[task.id] ? 'running' : (status === 'done' ? 'done' : '');

    return (
      '<div class="task-card' + (isOpen ? ' open' : '') + '" data-card="' + task.id + '">' +
      '<div class="task-head" data-action="toggle" data-task="' + task.id + '">' +
      '<span class="task-id">' + task.id + '</span>' +
      '<span class="task-title">' + esc(task.title) + '</span>' +
      '<span class="task-status ' + status + '">' + statusLabel + '</span>' +
      '<span class="chevron">&#9656;</span>' +
      '</div>' +
      '<div class="task-body">' +
      '<div class="instruction"><p>' + esc(task.instruction) + '</p><ul>' + criteriaHtml + '</ul></div>' +
      renderBrief(task) +
      renderReference(task) +
      cvHtml +
      '<div class="timer-row">' +
      '<span class="timer-display ' + timerClass + '" data-timer="' + task.id + '">' + fmtElapsed(elapsedMs) + '</span>' +
      timerBtn +
      '</div>' +
      '</div></div>'
    );
  }

  function renderLogRows() {
    if (!STATE.logs.length) {
      return '<tr><td colspan="4" class="empty-row">Belum ada pengerjaan yang tercatat.</td></tr>';
    }
    return STATE.logs.slice(0, 50).map(function (l) {
      return '<tr><td>' + esc(l.participant) + '</td><td class="mono">' + esc(l.taskId) + '</td>' +
        '<td class="mono">' + fmtElapsed(l.durationSec * 1000) + '</td><td>' + fmtWhen(l.endedAt) + '</td></tr>';
    }).join('');
  }

  var THEME_KEY = 'rockyUtTheme';
  function getCurrentTheme() {
    var explicit = document.documentElement.getAttribute('data-theme');
    if (explicit === 'light' || explicit === 'dark') return explicit;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  function toggleTheme() {
    var next = getCurrentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    renderUI();
  }
  var SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>';
  var MOON_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg>';
  function renderThemeToggle() {
    var theme = getCurrentTheme();
    var icon = theme === 'dark' ? MOON_ICON : SUN_ICON;
    var label = theme === 'dark' ? 'Dark' : 'Light';
    return '<button type="button" class="theme-toggle" data-action="toggle-theme">' + icon + '<span>' + label + '</span></button>';
  }
  function renderUI() {
    var participant = getParticipant();
    root.innerHTML =
      '<div class="shell">' +
      '<header class="masthead">' +
      renderThemeToggle() +
      '<span class="eyebrow">Rocky HR &middot; Usability Test Runner</span>' +
      '<h1>Kerjakan Task Usability Test</h1>' +
      '<p class="subtitle">Pilih task, baca instruksinya, jalankan timer selama Anda mengerjakannya di Rocky, lalu klik Stop saat selesai.</p>' +
      '<div class="participant-box">' +
      '<label for="participant-input">Nama/ID Partisipan</label>' +
      '<input id="participant-input" type="text" placeholder="mis. P01 — Budi" value="' + esc(participant) + '">' +
      '</div>' +
      '</header>' +
      '<h2 class="sec-title">Daftar Task</h2>' +
      TASKS.map(renderTaskCard).join('') +
      '<div class="log-head"><h2 class="sec-title" style="margin:0;">Riwayat Pengerjaan</h2>' +
      (STATE.logs.length ? '<button type="button" class="ghost" data-action="clear-logs">Hapus Riwayat</button>' : '') +
      '</div>' +
      '<div class="table-wrap"><table><thead><tr><th>Partisipan</th><th>Task</th><th>Durasi</th><th>Selesai</th></tr></thead>' +
      '<tbody id="log-body">' + renderLogRows() + '</tbody></table></div>' +
      '<div id="capability-note"></div>' +
      '<footer class="doc-footer">Rocky HR &middot; Usability Test Runner</footer>' +
      '</div>' +
      '<div class="toast" id="toast"></div>';

    attachHandlers();
    checkCapabilities();
  }

  function attachHandlers() {
    var input = document.getElementById('participant-input');
    if (input) {
      input.addEventListener('input', function () {
        setParticipantStorage(input.value);
        renderStatusesOnly();
      });
    }
    root.addEventListener('click', onRootClick);
  }

  function renderStatusesOnly() {
    TASKS.forEach(function (task) {
      var card = root.querySelector('[data-card="' + task.id + '"]');
      if (!card) return;
      var badge = card.querySelector('.task-status');
      if (!badge) return;
      var status = taskStatus(task);
      badge.className = 'task-status ' + status;
      badge.textContent = status === 'running' ? 'Berjalan' : status === 'done' ? 'Selesai' : 'Belum dikerjakan';
    });
  }

  function onRootClick(e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    var taskId = el.getAttribute('data-task');

    if (action === 'toggle-theme') { toggleTheme(); return; }
    if (action === 'clear-logs') { clearLogs(); return; }
    if (action === 'toggle') {
      openCard = openCard === taskId ? null : taskId;
      renderUI();
      return;
    }
    if (action === 'copy-brief') {
      var taskB = TASKS.filter(function (t) { return t.id === taskId; })[0];
      if (taskB && taskB.brief) copyText(taskB.brief.copyText);
      return;
    }
    if (action === 'copy-reference') {
      var taskR = TASKS.filter(function (t) { return t.id === taskId; })[0];
      if (taskR && taskR.reference) copyText(taskR.reference.text);
      return;
    }
    if (action === 'start') { startTimer(taskId); return; }
    if (action === 'stop') { stopTimer(taskId); return; }
    if (action === 'download-cv') { downloadCV(el.getAttribute('data-slug')); return; }
    if (action === 'download-all-cv') { downloadAllCV(el); return; }
  }

  function startTimer(taskId) {
    var participant = getParticipant().trim();
    if (!participant) {
      toast('Isi nama/ID partisipan dulu sebelum mulai.');
      var input = document.getElementById('participant-input');
      if (input) input.focus();
      return;
    }
    running[taskId] = Date.now();
    persistRunning();
    openCard = taskId;
    renderUI();
    ensureTicking();
  }

  function clearLogs() {
    if (!STATE.logs.length) return;
    if (!confirm('Hapus semua riwayat pengerjaan (' + STATE.logs.length + ' entri)? Tindakan ini tidak bisa dibatalkan.')) return;
    STATE.logs = [];
    try { localStorage.removeItem(LOGS_KEY); } catch (e) {}
    renderUI();
    toast('Riwayat pengerjaan dihapus.');
  }

  function stopTimer(taskId) {
    var startedAt = running[taskId];
    if (!startedAt) return;
    delete running[taskId];
    persistRunning();

    var durationSec = Math.max(1, Math.round((Date.now() - startedAt) / 1000));
    var entry = {
      id: 'log-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
      participant: getParticipant().trim() || 'Anonim',
      taskId: taskId,
      durationSec: durationSec,
      endedAt: new Date().toISOString()
    };
    STATE.logs.unshift(entry);
    renderUI();
    toast('Task ' + taskId + ' selesai — ' + fmtElapsed(durationSec * 1000));
    persistLog();
  }

  function persistLog() {
    try { localStorage.setItem(LOGS_KEY, JSON.stringify(STATE.logs)); } catch (e) {}
    if (!window.claude || typeof window.claude.use !== 'function') return;
    window.claude.use('artifact').then(function (artifact) {
      if (!artifact) return;
      return artifact.publish(renderPage(STATE));
    }).catch(function (err) {
      if (err && err.code === 'conflict') return;
      toast('Gagal menyimpan log bersama (' + (err && err.code) + ').');
    });
  }

  function findCandidate(slug) {
    return CANDIDATES.filter(function (c) { return c.slug === slug; })[0];
  }

  function triggerBlobDownload(filename, blobOrText, mime) {
    var blob = (blobOrText instanceof Blob) ? blobOrText : new Blob([blobOrText], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function buildCvPdfBlob(c, i) {
    var jsPDF = window.jspdf && window.jspdf.jsPDF;
    if (!jsPDF) return null;
    var doc = new jsPDF({ unit: 'pt', format: 'a4' });
    var margin = 50;
    var maxWidth = doc.internal.pageSize.getWidth() - margin * 2;
    var y = 60;

    doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(20);
    doc.text(c.name, margin, y); y += 22;

    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(90);
    doc.text(candidateEmail(c.name) + '   |   ' + candidatePhone(i), margin, y); y += 14;
    doc.setTextColor(160);
    doc.text('CV SINTETIS / DUMMY -- untuk keperluan usability testing', margin, y); y += 26;
    doc.setTextColor(20);

    function section(title, body) {
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(20);
      doc.text(title, margin, y); y += 15;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(50);
      var lines = doc.splitTextToSize(body, maxWidth);
      doc.text(lines, margin, y);
      y += lines.length * 13 + 16;
    }

    section('RINGKASAN', c.summary);
    section('PENDIDIKAN', c.edu);
    section('PENGALAMAN KERJA', c.role + ' -- (' + c.years + ' tahun)\n' + c.work);
    section('KEAHLIAN', c.skills);

    return doc.output('blob');
  }

  function downloadCV(slug) {
    var c = findCandidate(slug);
    if (!c) return;
    var i = CANDIDATES.indexOf(c);
    var pdf = buildCvPdfBlob(c, i);
    if (!pdf) { toast('Gagal membuat PDF — coba muat ulang halaman.'); return; }
    triggerBlobDownload(c.filename, pdf, 'application/pdf');
    toast('CV ' + c.name + ' diunduh.');
  }

  function downloadAllCV(btn) {
    if (btn) { btn.disabled = true; btn.textContent = 'Mengunduh...'; }
    CANDIDATES.forEach(function (c, i) {
      setTimeout(function () {
        var pdf = buildCvPdfBlob(c, i);
        if (pdf) triggerBlobDownload(c.filename, pdf, 'application/pdf');
        if (i === CANDIDATES.length - 1) {
          toast('Semua ' + CANDIDATES.length + ' CV diunduh.');
          if (btn) { btn.disabled = false; btn.textContent = 'Unduh Semua (' + CANDIDATES.length + ' CV)'; }
        }
      }, i * 250);
    });
  }

  function copyText(text, okMsg) {
    okMsg = okMsg || 'Tersalin ke clipboard.';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(okMsg); })
        .catch(function () { fallbackCopy(text, okMsg); });
    } else {
      fallbackCopy(text, okMsg);
    }
  }
  function fallbackCopy(text, okMsg) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); toast(okMsg || 'Tersalin ke clipboard.'); } catch (e) { toast('Gagal menyalin.'); }
    document.body.removeChild(ta);
  }

  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600);
  }

  function ensureTicking() {
    if (tickInterval) return;
    tickInterval = setInterval(function () {
      var anyRunning = false;
      Object.keys(running).forEach(function (taskId) {
        anyRunning = true;
        var el = root.querySelector('[data-timer="' + taskId + '"]');
        if (el) el.textContent = fmtElapsed(Date.now() - running[taskId]);
      });
      if (!anyRunning) { clearInterval(tickInterval); tickInterval = null; }
    }, 1000);
  }

  function checkCapabilities() {
    var note = document.getElementById('capability-note');
    if (!note) return;
    if (!window.claude || typeof window.claude.use !== 'function') {
      note.innerHTML = '<div class="note">Log bersama tidak aktif di tampilan ini — durasi tetap tercatat, tapi hanya untuk sesi ini.</div>';
      return;
    }
    window.claude.use('artifact').then(function (a) {
      if (!a) note.innerHTML = '<div class="note">Log bersama tidak aktif di tampilan ini — durasi tetap tercatat, tapi hanya untuk sesi ini.</div>';
    });
  }

  function renderPage(state) {
    var json = JSON.stringify(state).replace(/</g, '\\u003c');
    var headExtra = document.getElementById('page-style') ? document.getElementById('page-style').outerHTML : '';
    return '<!doctype html><html lang="id"><head>' +
      '<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">' +
      '<title>Rocky HR Test Runner</title>' + headExtra +
      '</head><body><div id="root"></div>' +
      '<script type="application/json" id="state-data">' + json + '<\/script>' +
      '<script>' + SELF_SRC + '<\/script>' +
      '</body></html>';
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderUI);
  } else {
    renderUI();
  }
  if (Object.keys(running).length) ensureTicking();
})();
  </script>
</body>
</html>
